<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FF7A00" />
  <title>Hors connexion — Tikeo</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#FF7A00 0%,#FF9A3D 45%,#0057B8 100%);color:#111}
    .card{max-width:400px;width:100%;background:#fff;padding:36px 28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    img{height:44px;width:auto;margin-bottom:20px}
    .emoji{font-size:56px;line-height:1;margin-bottom:8px}
    h1{font-size:22px;margin:8px 0}
    p{color:#555;font-size:14px;line-height:1.6;margin:0 0 22px}
    button{background:#FF7A00;color:#fff;border:0;padding:12px 26px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
    button:hover{background:#e56d00}
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-tikeo.png" alt="Tikeo" />
    <div class="emoji">📡</div>
    <h1>Vous êtes hors connexion</h1>
    <p>Impossible de joindre Tikeo pour le moment. Vérifiez votre connexion internet, puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
